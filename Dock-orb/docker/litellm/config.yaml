# ============================================================
# LiteLLM Proxy Configuration
# Unified provider abstraction for Capsule AI
# ============================================================

model_list:
  # ---- OpenAI ----
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      max_tokens: 16384
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      max_tokens: 16384
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006

  # ---- Anthropic ----
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      max_tokens: 8192
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      max_tokens: 8192
      input_cost_per_token: 0.0000008
      output_cost_per_token: 0.000004

  # ---- Google Gemini ----
  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GOOGLE_API_KEY
    model_info:
      max_tokens: 8192
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006

  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro-preview-06-05
      api_key: os.environ/GOOGLE_API_KEY
    model_info:
      max_tokens: 65536
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001

  # ---- NVIDIA NIM ----
  - model_name: nvidia-nemotron
    litellm_params:
      model: nvidia_nim/nvidia/llama-3.1-nemotron-70b-instruct
      api_key: os.environ/NVIDIA_API_KEY
      api_base: https://integrate.api.nvidia.com/v1

  # ---- Groq (Fast Inference) ----
  - model_name: groq-llama
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
    model_info:
      max_tokens: 32768
      input_cost_per_token: 0.00000059
      output_cost_per_token: 0.00000079

  # ---- Together AI ----
  - model_name: together-llama
    litellm_params:
      model: together_ai/meta-llama/Llama-3.3-70B-Instruct-Turbo
      api_key: os.environ/TOGETHER_API_KEY

  # ---- OpenRouter ----
  - model_name: openrouter-auto
    litellm_params:
      model: openrouter/auto
      api_key: os.environ/OPENROUTER_API_KEY

  # ---- Ollama (Local) ----
  - model_name: ollama-llama
    litellm_params:
      model: ollama/llama3.2
      api_base: http://host.docker.internal:11434
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: ollama-codestral
    litellm_params:
      model: ollama/codestral
      api_base: http://host.docker.internal:11434
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

  # ---- LM Studio (Local) ----
  - model_name: lmstudio-local
    litellm_params:
      model: openai/local-model
      api_base: http://host.docker.internal:1234/v1
      api_key: lm-studio
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

# ---- Router Settings ----
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  timeout: 120
  retry_after: 5
  fallbacks:
    - gpt-4o: [claude-sonnet, gemini-2.5-pro]
    - claude-sonnet: [gpt-4o, gemini-2.5-pro]
    - gpt-4o-mini: [claude-haiku, gemini-2.0-flash, groq-llama]

# ---- General Settings ----
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  alerting:
    - slack
  alert_types:
    - llm_exceptions
    - budget_alerts

# ---- Litellm Settings ----
litellm_settings:
  drop_params: true
  set_verbose: false
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
