version: "3.9"

services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: capsule-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capsule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capsule_secret}
      POSTGRES_DB: ${POSTGRES_DB:-capsule_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capsule}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: capsule-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Qdrant (Vector DB) ----
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: capsule-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # ---- LiteLLM Proxy ----
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: capsule-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      DATABASE_URL: postgresql://${POSTGRES_USER:-capsule}:${POSTGRES_PASSWORD:-capsule_secret}@postgres:5432/${POSTGRES_DB:-capsule_ai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- NestJS API ----
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: capsule-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-capsule}:${POSTGRES_PASSWORD:-capsule_secret}@postgres:5432/${POSTGRES_DB:-capsule_ai}?schema=public
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      AI_SERVICES_URL: http://ai-services:8000
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-64-char-string}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-to-another-random-64-char-string}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      litellm:
        condition: service_started

  # ---- Python AI Services ----
  ai-services:
    build:
      context: ..
      dockerfile: docker/ai-services.Dockerfile
    container_name: capsule-ai-services
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      LITELLM_URL: http://litellm:4000
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      REDIS_URL: redis://redis:6379
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy

  # ---- Next.js Frontend ----
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: capsule-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-to-a-random-secret}
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
